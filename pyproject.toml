[project]
name = "air-dv"
version = "0.1.0"
description = "AI-ready document validator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]
license = { text = "Proprietary" }
authors = [
  { name = "AIR-DV team" },
]

[project.scripts]
air-dv = "air_dv.cli:main"
air-dv-ui = "air_dv.web:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_dv"]

[tool.ruff]
line-length = 100
target-version = "py312"
